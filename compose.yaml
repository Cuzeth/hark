services:
  hark:
    build: .
    ports:
      # Bind publicly only behind a trusted proxy; auth rate limits use its client-IP headers.
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: /data/hark.sqlite
      # Public origin of this deployment (used for sign-in + webhook URLs).
      APP_URL: ${APP_URL:-http://localhost:8787}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # The single account, seeded on first boot. Password must be 8+ characters.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-dev.abdeen.hark}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-sandbox}
      # Only set this to a header the edge overwrites; see env.ts for why.
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
      SERVICE_RATE_LIMIT_PER_MINUTE: ${SERVICE_RATE_LIMIT_PER_MINUTE:-300}
      ACCOUNT_RATE_LIMIT_PER_MINUTE: ${ACCOUNT_RATE_LIMIT_PER_MINUTE:-1500}
    volumes:
      - hark-data:/data
    restart: unless-stopped

volumes:
  hark-data:
